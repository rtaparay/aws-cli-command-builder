<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="catalog" content="AWS CLI v2 — botocore service models" />
    <title>CLI Command Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 7l4 5-4 5" />
            <path d="M13 17h6" />
          </svg>
        </span>
        <div style="min-width: 0">
          <h1>CLI <b>Command</b> Builder</h1>
          <div class="sub">Create AWS CLI commands step by step</div>
        </div>
      </div>
      <span class="divider"></span>
      <button
        class="icon-btn"
        id="btn-sidebar"
        title="Ocultar / mostrar menú"
        data-icon="sidebar"
      ></button>
      <button
        class="icon-btn"
        id="btn-home"
        title="Inicio"
        data-icon="home"
      ></button>
      <button
        class="icon-btn"
        id="btn-gopts"
        title="Opciones globales"
        data-icon="gear"
      ></button>
      <div class="topsearch">
        <span data-icon="search"></span>
        <input
          id="search"
          type="search"
          placeholder="Buscar comandos…"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <span class="spacer"></span>
      <button class="icon-btn" id="btn-theme" title="Cambiar tema"></button>
    </header>

    <div class="shell" id="shell">
      <aside class="pane svc">
        <div class="pane-h">
          <div class="filt">
            <span data-icon="search"></span>
            <input
              id="svc-filter"
              type="search"
              placeholder="Filtrar servicios…"
              autocomplete="off"
            />
          </div>
        </div>
        <nav class="svc-list" id="svc-list"></nav>
      </aside>

      <section class="pane cmds" id="cmds-pane">
        <div class="pane-h">
          <div class="filt">
            <span data-icon="search"></span>
            <input
              id="cmd-filter"
              type="search"
              placeholder="Filtrar comandos…"
              autocomplete="off"
            />
          </div>
        </div>
        <div class="cmd-list" id="cmd-list"></div>
      </section>

      <section class="pane detail" id="detail-pane"></section>
    </div>

    <div class="gopts-overlay" id="gopts-overlay" hidden></div>
    <aside class="gopts" id="gopts" hidden aria-label="Opciones globales">
      <div class="gopts-h">
        <div>
          <div class="gopts-t">Opciones globales</div>
          <div class="gopts-s">
            Opciones aceptadas por todo comando de AWS CLI. Se aplican a cada
            comando que construyes y persisten entre páginas.
          </div>
        </div>
        <button class="gopts-x" id="gopts-close" aria-label="Cerrar">✕</button>
      </div>
      <div class="gopts-b" id="gopts-body"></div>
      <div class="gopts-foot">
        <span>Guardado en este dispositivo.</span>
        <button class="gopts-clear" id="gopts-clear">Limpiar todo</button>
      </div>
    </aside>

    <div class="toast" id="toast"></div>

    <!-- Orden importante: cada archivo usa las funciones y constantes de los anteriores. -->
    <script src="js/data/sampleCatalog.js"></script>
    <script src="js/lib/storage.js"></script>
    <script src="js/lib/clipboard.js"></script>
    <script src="js/lib/globalOptions.js"></script>
    <script src="js/lib/ai.js"></script>
    <script src="js/lib/settings.js"></script>
    <script src="js/lib/command.js"></script>
    <script src="js/ui/dom.js"></script>
    <script src="js/ui/icons.js"></script>
    <script src="js/ui/detail.js"></script>
    <script src="js/ui/home.js"></script>
    <script src="js/ui/assistant.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
